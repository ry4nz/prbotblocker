<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>PR Bot Blocker — Options</title>
  <style>
    body { font-family: -apple-system, system-ui, "Segoe UI", sans-serif; padding: 16px; min-width: 380px; max-width: 560px; color: #1f2328; }
    h1 { font-size: 18px; margin: 0 0 8px; }
    p { color: #57606a; font-size: 13px; margin: 0 0 12px; line-height: 1.45; }
    code { background: #eaeef2; padding: 1px 4px; border-radius: 4px; }
    textarea { width: 100%; height: 220px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; box-sizing: border-box; padding: 8px; border: 1px solid #d0d7de; border-radius: 6px; resize: vertical; }
    .row { display: flex; gap: 8px; align-items: center; margin-top: 12px; }
    button { padding: 6px 12px; cursor: pointer; border: 1px solid #d0d7de; border-radius: 6px; background: #f6f8fa; font-size: 13px; }
    button.primary { background: #2da44e; color: white; border-color: #2da44e; }
    button:hover { filter: brightness(0.97); }
    .status { color: #2da44e; font-size: 13px; }
  </style>
</head>
<body>
  <h1>PR Bot Blocker</h1>
  <p>Enter bot usernames to hide on GitHub PR, issue, and discussion pages — one per line. Matching is case-insensitive and the trailing <code>[bot]</code> suffix is ignored, so <code>github-actions</code> matches <code>github-actions[bot]</code>.</p>
  <textarea id="bots" spellcheck="false" placeholder="github-actions&#10;dependabot&#10;copilot"></textarea>
  <div class="row">
    <button id="save" class="primary">Save</button>
    <button id="reset">Reset to defaults</button>
    <span id="status" class="status"></span>
  </div>
  <script src="options.js"></script>
</body>
</html>
